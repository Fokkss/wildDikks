name: ML Pipeline Check

on:
  push:
    branches: [ "main", "solvrxx_branch", "pd_branch", "cheesyplate_branch", "vaas_branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wind-app .

      - name: Save Docker image
        run: docker save wind-app > wind-app.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: wind-app.tar

  lint:
    name: Lint and format check
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run ruff lint
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff check .

      - name: Run ruff format check
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff format --check .

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run unit tests
        run: docker run --rm -e PYTHONPATH=/app wind-app pytest tests/ -m "not integration"
      - name: Train small model
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd)/output:/app/output \
            wind-app \
            python train.py \
              --train_path tests/fixtures/train_dataset_small.csv \
              --model_dir output/artifacts \
              --target "Результирующий расчет" \
              --n_splits 2
              --n_estimators 50 \
              --early_stopping_rounds 10

      - name: Predict small validation
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd)/output:/app/output \
            wind-app \
            python predict.py \
              --features_path tests/fixtures/valid_features_small.csv \
              --model_dir output/artifacts \
              --output_path output/prediction.csv

      - name: Validate prediction format
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd)/output:/app/output \
            wind-app \
            pytest tests/test_submission_format.py

  integration:
    name: Train and predict smoke test
    needs: [build, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run integration tests
        run: docker run --rm -e PYTHONPATH=/app wind-app pytest tests/ -m "integration"

  artifact-check:
    name: Check generated artifacts
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run artifact smoke test
        run: |
          mkdir -p output
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd)/output:/app/output \
            wind-app \
            pytest tests/test_submission_format.py