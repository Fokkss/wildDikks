name: ML Pipeline Check

on:
  push:
    branches: [ "main", "solvrxx_branch", "pd_branch", "cheesyplate_branch", "vaas_branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wind-app .

      - name: Save Docker image
        run: docker save wind-app > wind-app.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: wind-app.tar

  lint:
    name: Lint and format check
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run ruff lint
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff check .

      - name: Run ruff format check
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff format --check .

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run unit tests
        run: docker run --rm -e PYTHONPATH=/app wind-app pytest tests/ -m "not integration"

  integration:
    name: Train and predict smoke test
    needs: [build, lint, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Generate fake CSV fixtures
        run: |
          mkdir -p tests/fixtures output

          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            python - << 'EOF'
          import numpy as np
          import pandas as pd

          np.random.seed(42)

          n_train = 120
          n_valid = 24

          dt_train = pd.date_range(
              "2024-01-01",
              periods=n_train,
              freq="h",
          )

          ws = np.random.uniform(3, 18, n_train)
          wd = np.random.uniform(0, 360, n_train)
          temp = np.random.uniform(-10, 25, n_train)
          pressure = np.random.uniform(980, 1035, n_train)
          repair = np.random.randint(0, 4, n_train)

          power = 0.03 * ws**3 + np.random.normal(0, 2, n_train)
          power *= (26 - repair) / 26
          power = np.clip(power, 0, 90.09)

          train_df = pd.DataFrame(
              {
                  "timestamp": dt_train,
                  "wind_speed_80m": ws,
                  "wind_dir_80m": wd,
                  "temperature_80m": temp,
                  "pressure": pressure,
                  "repair": repair,
                  "Результирующий расчет": power,
              }
          )

          train_df.to_csv(
              "tests/fixtures/train_dataset_small.csv",
              index=False,
          )

          dt_valid = pd.date_range(
              "2024-02-01",
              periods=n_valid,
              freq="h",
          )

          valid_df = pd.DataFrame(
              {
                  "timestamp": dt_valid,
                  "wind_speed_80m": np.random.uniform(3, 18, n_valid),
                  "wind_dir_80m": np.random.uniform(0, 360, n_valid),
                  "temperature_80m": np.random.uniform(-10, 25, n_valid),
                  "pressure": np.random.uniform(980, 1035, n_valid),
                  "repair": np.random.randint(0, 4, n_valid),
              }
          )

          valid_df.to_csv(
              "tests/fixtures/valid_features_small.csv",
              index=False,
          )

          print("Synthetic fixtures generated")
          EOF

      - name: Train model
        run: |
          mkdir -p output
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            python -m new_model.train \
              --train_path tests/fixtures/train_dataset_small.csv \
              --model_dir output/artifacts \
              --target "Результирующий расчет" \
              --n_splits 2 \
              --n_estimators 50 \
              --early_stopping_rounds 10

      - name: Predict validation
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            python -m new_model.predict \
              --features_path tests/fixtures/valid_features_small.csv \
              --model_dir output/artifacts \
              --output_path output/prediction.csv

      - name: Validate prediction format
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            pytest tests/test_submission_format.py

      - name: Run integration tests
        run: docker run --rm -e PYTHONPATH=/app -v $(pwd):/app -w /app wind-app pytest tests/ -m "integration"