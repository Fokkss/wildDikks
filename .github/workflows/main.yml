name: ML Pipeline Check

on:
  push:
    branches: [ "main", "solvrx_branch", "pd_branch", "cheesyplate_branch", "vaas_branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # vuild check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t wind-app .
      # image for tasks, to prevent building again
      - name: Save Docker image
        run: docker save wind-app > wind-app.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: wind-app.tar

  # unit-tests
  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Load Docker image
        run: docker load < wind-app.tar
      - name: Run Pytest
        run: docker run --rm -e PYTHONPATH=/app wind-app pytest tests/

  # format check
  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact
      - name: Load Docker image
        run: docker load < wind-app.tar
      - name: Run Inference & Validate Format
        run: |
          mkdir -p output
          docker run --rm -v $(pwd)/output:/app/output wind-app python src/infer.py
          docker run --rm -v $(pwd)/output:/app/output wind-app python src/validate_format.py
      - name: Check Output File
        run: |
          if [ -s output/prediction.csv ]; then
            echo "Success: prediction.csv is ready"
          else
            exit 1
          fi