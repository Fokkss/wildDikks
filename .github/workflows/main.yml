name: ML Pipeline Check

on:
  push:
    branches: [ "main", "solvrxx_branch", "pd_branch", "cheesyplate_branch", "vaas_branch" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wind-app .

      - name: Save Docker image
        run: docker save wind-app > wind-app.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: wind-app.tar

  lint:
    name: Lint and format check
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run ruff lint
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff check .

      - name: Run ruff format check
        run: docker run --rm -e PYTHONPATH=/app wind-app ruff format --check .

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Run unit tests
        run: docker run --rm -e PYTHONPATH=/app wind-app pytest tests/ -m "not integration"

  integration:
    name: Train and predict smoke test
    needs: [build, lint, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-artifact

      - name: Load Docker image
        run: docker load < wind-app.tar

      - name: Generate fake CSV & Train model
        run: |
          mkdir -p tests/fixtures output

          python3 - << 'EOF'
          import csv
          import random
          from datetime import datetime, timedelta

          random.seed(42)

          n_train = 120
          n_valid = 24

          train_path = "tests/fixtures/train_dataset_small.csv"
          valid_path = "tests/fixtures/valid_features_small.csv"

          with open(train_path, "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow([
                  "timestamp",
                  "wind_speed_80m",
                  "wind_dir_80m",
                  "temperature_80m",
                  "pressure",
                  "repair",
                  "Результирующий расчет",
              ])

              start = datetime(2024, 1, 1)

              for i in range(n_train):
                  timestamp = start + timedelta(hours=i)
                  ws = random.uniform(3, 18)
                  wd = random.uniform(0, 360)
                  temp = random.uniform(-10, 25)
                  pressure = random.uniform(980, 1035)
                  repair = random.randint(0, 3)

                  power = 0.03 * ws ** 3 + random.gauss(0, 2)
                  power *= (26 - repair) / 26
                  power = max(0, min(90.09, power))

                  writer.writerow([
                      timestamp.strftime("%Y-%m-%d %H:%M:%S"),
                      ws,
                      wd,
                      temp,
                      pressure,
                      repair,
                      power,
                  ])

          with open(valid_path, "w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow([
                  "timestamp",
                  "wind_speed_80m",
                  "wind_dir_80m",
                  "temperature_80m",
                  "pressure",
                  "repair",
              ])

              start = datetime(2024, 2, 1)

              for i in range(n_valid):
                  timestamp = start + timedelta(hours=i)
                  ws = random.uniform(3, 18)
                  wd = random.uniform(0, 360)
                  temp = random.uniform(-10, 25)
                  pressure = random.uniform(980, 1035)
                  repair = random.randint(0, 3)

                  writer.writerow([
                      timestamp.strftime("%Y-%m-%d %H:%M:%S"),
                      ws,
                      wd,
                      temp,
                      pressure,
                      repair,
                  ])

          print("Synthetic fixtures generated")
          EOF

          ls -la tests/fixtures

          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            python -m new_model.train \
              --train_path tests/fixtures/train_dataset_small.csv \
              --model_dir output/artifacts \
              --target "Результирующий расчет" \
              --n_splits 2 \
              --n_estimators 50 \
              --early_stopping_rounds 10

      - name: Predict validation
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            python -m new_model.predict \
              --features_path tests/fixtures/valid_features_small.csv \
              --model_dir output/artifacts \
              --output_path output/prediction.csv

      - name: Validate prediction format
        run: |
          docker run --rm \
            -e PYTHONPATH=/app \
            -v $(pwd):/app \
            -w /app \
            wind-app \
            pytest tests/test_submission_format.py

      - name: Run integration tests
        run: docker run --rm -e PYTHONPATH=/app -v $(pwd):/app -w /app wind-app pytest tests/ -m "integration"